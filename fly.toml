# fly.toml — Payload Rail v1
# Deploy from ~/workspace/products/payload-flow/ (build context):
#   fly launch --no-deploy   (first time, then fly deploy)
#   fly volumes create rail_data --size 1
app = "payload-rail"
primary_region = "iad"

[build]
  dockerfile = "rail/Dockerfile"

[env]
  RAIL_DB_PATH = "/data/rail.db"
  # Payload's USDC receiving address on Base (public; used for crypto settlement verification)
  X402_PAY_TO = "0xb3ecD1c309bEe30744D28f4B8957aA26D755B36A"
  X402_NETWORK = "eip155:8453"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[mounts]]
  source = "rail_data"
  destination = "/data"
  initial_size = "1gb"
